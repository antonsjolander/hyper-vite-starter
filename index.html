<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hyper Vite Starter</title>
  </head>
  <body>
    <main>
      <h1 id="title">Hyper Chirp</h1>
      <form id="chirp-form" style="display: flex; flex-direction: column; width: 400px;">
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Your name" name="author_name">
        <label for="content">Content</label>
        <textarea id="content" placeholder="Write your message" name="content" maxlength="280" required></textarea>
        <label for="tag">Tag</label>
        <input type="text" name="tag" placeholder="FED28">
        <label for="is_anonymous">Anonymous?</label>
        <input type="checkbox" name="is_anonymous">
        <button type="submit">Post chirp</button>
      </form>
      <div class="container">
        <div class="chirps">
          <span style="opacity: 0;" class="loader">Loading...</span>
        </div>
        <button class="load-data">load chirps</button>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>

</html>
